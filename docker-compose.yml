name: heimdall

x-heimdall: &heimdall
  image: ghcr.io/sebdraven/heimdall:latest
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  environment:
    HEIMDALL_PG_DSN: postgres://heimdall:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/heimdall?sslmode=disable
    HEIMDALL_CH_ADDR: clickhouse:9000
    HEIMDALL_CH_DATABASE: heimdall
    HEIMDALL_CH_USER: ${CLICKHOUSE_USER:-heimdall}
    HEIMDALL_CH_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
  depends_on:
    clickhouse:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: heimdall
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-heimdall}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Passes only once init.sql has created the last table.
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1 FROM heimdall.tuple_state LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall -d heimdall"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    <<: *heimdall
    command: ["heimdall-api"]
    ports:
      - "127.0.0.1:8080:8080"

  collector:
    <<: *heimdall
    command: ["heimdall-collector"]

volumes:
  clickhouse-data:
  postgres-data:
