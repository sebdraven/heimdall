{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
<title>{{block "title" .}}Heimdall{{end}}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'>
<header>
  <a class="brand" href="/">Heimdall</a>
  {{with .User}}
  <nav>
    <a href="/campaigns">Campaigns</a>
    <a href="/events">Events</a>
    {{if $.Can "admin"}}<a href="/admin">Admin</a>{{end}}
  </nav>
  <form class="search" method="get" action="/search" role="search">
    <input type="search" name="q" value="{{block "search_q" $}}{{end}}" placeholder="Domain, IP or value" aria-label="Search">
  </form>
  <form class="logout" method="post" action="/logout">
    {{template "csrf" $}}
    <span>{{.Username}} ({{.Role}})</span>
    <button type="submit">Log out</button>
  </form>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
