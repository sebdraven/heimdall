{{define "title"}}Sign in · Heimdall{{end}}
{{define "content"}}
<section class="login">
  <h1>Sign in</h1>
  {{with .Data.Error}}<p class="error">{{.}}</p>{{end}}
  <form method="post" action="/login">
    {{template "csrf" .}}
    <label>Username <input name="username" autocomplete="username" required autofocus value="{{.Data.Username}}"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{{end}}
